global
    maxconn 4096
    stats socket /tmp/haproxy.sock mode 666 level user

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend web_in
    bind 10.0.0.10:80
    default_backend web_pool

backend web_pool
    balance roundrobin
    server srv1 10.0.0.11:80 check
    server srv2 10.0.0.12:80 check
    server srv3 10.0.0.13:80 check
